name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch, commit, or tag to build
        required: true
        default: main
        type: string
      release_tag:
        description: Version tag used only when publishing a release (for example, v0.1.2-rc1)
        required: false
        type: string
      publish_release:
        description: Publish artifacts as a GitHub Release
        required: true
        default: false
        type: boolean

env:
  BUILD_REF: ${{ inputs.build_ref || github.ref }}
  BUILD_VERSION: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller packaging/pyinstaller/BenchSim.spec --noconfirm --clean

      - name: Create Linux archive
        run: |
          VERSION="${BUILD_VERSION}"
          tar -C dist -czf "BenchSim-${VERSION}-linux-x86_64.tar.gz" BenchSim

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: BenchSim-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build executable
        shell: powershell
        run: |
          python -m PyInstaller packaging/pyinstaller/BenchSim.spec --noconfirm --clean

      - name: Create Windows portable ZIP
        shell: powershell
        run: |
          $version = "${env:BUILD_VERSION}"
          Compress-Archive -Path "dist\BenchSim\*" -DestinationPath "BenchSim-$version-windows-x64-portable.zip" -Force

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $version = "${env:BUILD_VERSION}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\BenchSim.iss"
          $installer = Get-ChildItem "dist\installer\BenchSim-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Installer not found." }
          $version = "${env:BUILD_VERSION}"
          Move-Item $installer.FullName "BenchSim-$version-windows-x64-setup.exe" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: |
            BenchSim-*-windows-x64-portable.zip
            BenchSim-*-windows-x64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Package (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-latest
          - architecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Create macOS icon
        run: |
          ICONSET="${RUNNER_TEMP}/BenchSim.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" benchsim/benchsim.png --out "$ICONSET/icon_${size}x${size}.png"
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" benchsim/benchsim.png --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o "${RUNNER_TEMP}/BenchSim.icns"
          echo "BENCHSIM_MACOS_ICON=${RUNNER_TEMP}/BenchSim.icns" >> "$GITHUB_ENV"

      - name: Build application bundle
        run: python -m PyInstaller packaging/pyinstaller/BenchSim.spec --noconfirm --clean

      - name: Create macOS archive
        run: |
          VERSION="${BUILD_VERSION}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/BenchSim.app "BenchSim-${VERSION}-macos-${{ matrix.architecture }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}-release-assets
          path: BenchSim-*-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' || inputs.publish_release

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-release-assets
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-release-assets
          path: release-assets

      - name: Download Apple Silicon macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-release-assets
          path: release-assets

      - name: Download Intel macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-x86_64-release-assets
          path: release-assets

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          generate_release_notes: true
          files: release-assets/*
